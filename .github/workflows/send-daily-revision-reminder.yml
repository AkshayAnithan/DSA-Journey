name: Send daily revision reminder

on:
  schedule:
    # GitHub Actions schedules use UTC: 02:00 UTC is 7:30 AM IST.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision state
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send ntfy reminder
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }} # Optional for a long random public topic.
          REVISION_DASHBOARD_URL: ${{ vars.REVISION_DASHBOARD_URL }}
        run: node scripts/send-reminder.mjs